    :root {
      --bg: #16161a; --surface: #1f1f24; --surface2: #2a2a30;
      --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.14);

  .shell { max-width: 740px; margin: 0 auto; padding: 0 16px 60px; }

  header { padding: 28px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; }

  .protox-link { font-size: 12px; color: var(--accent-text); text-decoration: none; display: flex; align-items: center; gap: 4px; opacity: 0.8; }
  .protox-link:hover { opacity: 1; text-decoration: underline; }

  .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-faint); min-height: 22px; margin-bottom: 20px; }
  .breadcrumb .crumb { cursor: pointer; color: var(--accent-text); font-weight: 500; }
  .breadcrumb .crumb:hover { text-decoration: underline; }
  .breadcrumb .sep { color: var(--text-faint); user-select: none; }

  .back-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 520px) { .cat-grid { grid-template-columns: repeat(2, 1fr); } }
  .cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.1s; position: relative; display: flex; flex-direction: column; gap: 8px; }

  .cat-card h2 { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .cat-card p { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }
  .cat-arrow { position: absolute; top: 14px; right: 14px; color: var(--text-faint); font-size: 14px; }

  .sub-list { display: flex; flex-direction: column; gap: 8px; }

  .sub-info p { font-size: 12.5px; color: var(--text-muted); }

  .section-label { font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
  .product-list { display: flex; flex-direction: column; gap: 10px; }
  .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }

  .product-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .product-badge { font-size: 11px; font-weight: 500; background: var(--accent-light); color: var(--accent-text); padding: 2px 9px; border-radius: 4px; border: 1px solid rgba(26,82,118,0.15); }
  .product-purpose { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 12px; }
  .product-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 4px; background: var(--tag-bg); color: var(--text-muted); border: 1px solid var(--border); }
  .product-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--accent-text); text-decoration: none; font-weight: 500; opacity: 0.85; }

  /* HMS panel */
  .hms-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 20px; background: var(--surface2); border: none; border-top: 1px solid var(--border); cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text-muted); text-align: left; letter-spacing: 0.02em; transition: background 0.15s; }
  .hms-toggle:hover { background: var(--tag-bg); }
  .hms-toggle svg { flex-shrink: 0; transition: transform 0.2s; }
  .hms-toggle.open svg { transform: rotate(180deg); }
  .hms-panel { display: none; padding: 14px 20px 16px; border-top: 1px solid var(--border); background: var(--surface2); }
  .hms-panel.open { display: block; }

  .hms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  @media (max-width: 480px) { .hms-grid { grid-template-columns: 1fr; } }
  .hms-block { border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12px; line-height: 1.5; }
  .hms-block.warn { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); }
  .hms-block.danger { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger-text); }
  .hms-block.ok { background: var(--ok-bg); border: 1px solid var(--ok-border); color: var(--ok-text); }
  .hms-block.neutral { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
  .hms-block strong { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
  .hms-sds { font-size: 11.5px; color: var(--accent-text); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; }

  .note { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--text-muted); background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 16px; line-height: 1.55; border: 1px solid var(--border); }

  #view { animation: fadein 0.18s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  footer { text-align: center; font-size: 11.5px; color: var(--text-faint); margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); }
  footer a { color: var(--accent-text); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>

// ── SVG icons ─────────────────────────────────────────────────────────────────
const arrowRight = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><path d="M6 3l5 5-5 5"/></svg>`;
const arrowLeft  = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><path d="M10 3L5 8l5 5"/></svg>`;
const extLink    = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" width="12" height="12"><path d="M10 2h4v4M14 2 8 8M6 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3"/></svg>`;
const infoIcon   = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" width="14" height="14" style="flex-shrink:0;margin-top:1px"><circle cx="8" cy="8" r="6"/><path d="M8 7v4M8 5.5v.5"/></svg>`;
const chevDown   = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" width="13" height="13"><path d="M4 6l4 4 4-4"/></svg>`;

// ── Render ────────────────────────────────────────────────────────────────────
let state = { cat: null, sub: null };

function hmsKey(name) {
  // strip trailing badge-like text for lookup
  return name;
}

function renderHms(productName) {
  const h = hms[productName];
  if (!h) return '';
  const fareClass = h.fareklasse; // 'warn' | 'ok' | 'danger'
  return `
    <button class="hms-toggle" onclick="toggleHms(this)" aria-expanded="false">
      <span>⚠ HMS – vern og håndtering</span>
      ${chevDown}
    </button>
    <div class="hms-panel">
      <div class="hms-grid">
        <div class="hms-block ${fareClass}">
          <strong>Farenivå / advarsel</strong>
          ${h.farenotat}
        </div>
        <div class="hms-block neutral">
          <strong>Verneutstyr (PPE)</strong>
          ${h.ppe}
        </div>
        <div class="hms-block neutral">
          <strong>Ventilasjon</strong>
          ${h.ventilasjon}
        </div>
        <div class="hms-block neutral">
          <strong>Førstehjelp</strong>
          ${h.forstehjelp}
        </div>
      </div>
      <a class="hms-sds" href="${h.sds}" target="_blank" rel="noopener">${extLink} Les fullstendig SDS (sikkerhetsdatablad)</a>
    </div>`;
}

function toggleHms(btn) {
  const panel = btn.nextElementSibling;
  const open = panel.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', open);
}

function renderCategories() {
  return `<div class="cat-grid">` +
    data.categories.map(cat => `
      <div class="cat-card" onclick="selectCat('${cat.id}')" role="button" tabindex="0">
        <div class="cat-icon">${cat.icon}</div>
        <h2>${cat.title}</h2>
        <p>${cat.desc}</p>
        <span class="cat-arrow">${arrowRight}</span>
      </div>`).join('') + `</div>`;
}

function renderSubcategories(cat) {
  return `<button class="back-btn" onclick="goHome()">${arrowLeft} Alle kategorier</button>
    <div class="sub-list">` +
    cat.subcategories.map(sub => `
      <div class="sub-card" onclick="selectSub('${sub.id}')" role="button" tabindex="0">
        <div class="sub-info"><h3>${sub.title}</h3><p>${sub.desc}</p></div>
        <span class="sub-chevron">${arrowRight}</span>
      </div>`).join('') + `</div>`;
}

function renderProducts(sub) {
  const cat = data.categories.find(c => c.id === state.cat);
  return `<button class="back-btn" onclick="goCat()">${arrowLeft} ${cat.title}</button>
    <div class="section-label">Anbefalte produkter</div>
    <div class="product-list">` +
    sub.products.map(p => `
      <div class="product-card">
        <div class="product-body">
          <div class="product-header">
            <span class="product-name">${p.name}</span>
            <span class="product-badge">${p.badge}</span>
          </div>
          <p class="product-purpose">${p.purpose}</p>
          <div class="product-meta">${p.substrates.map(s => `<span class="tag">${s}</span>`).join('')}</div>
          <a class="product-link" href="${p.url}" target="_blank" rel="noopener">${extLink} Produktside hos Protox</a>
        </div>
        ${renderHms(p.name)}
      </div>`).join('') +
    `</div>
    <div class="note">${infoIcon}<span>HMS-opplysningene over er veiledende. Les alltid fullstendig sikkerhetsdatablad (SDS) og teknisk datablad før bruk. Aktivisert MR20 krever Protox-kurs.</span></div>`;
}

function render() {
  const app = document.getElementById('view');
  const bc  = document.getElementById('breadcrumb');
  if (!state.cat) {
    bc.innerHTML = '<span class="current">Velg skadekategori</span>';
    app.innerHTML = renderCategories();
  } else if (!state.sub) {
    const cat = data.categories.find(c => c.id === state.cat);
    bc.innerHTML = `<span class="crumb" onclick="goHome()">Start</span><span class="sep">›</span><span class="current">${cat.title}</span>`;
    app.innerHTML = renderSubcategories(cat);
  } else {
    const cat = data.categories.find(c => c.id === state.cat);
    const sub = cat.subcategories.find(s => s.id === state.sub);
    bc.innerHTML = `<span class="crumb" onclick="goHome()">Start</span><span class="sep">›</span><span class="crumb" onclick="goCat()">${cat.title}</span><span class="sep">›</span><span class="current">${sub.title}</span>`;
    app.innerHTML = renderProducts(sub);
  }
}

function goHome()     { state = { cat: null, sub: null }; render(); }
function goCat()      { state.sub = null; render(); }
function selectCat(id){ state.cat = id; state.sub = null; render(); }
function selectSub(id){ state.sub = id; render(); }

document.addEventListener('keydown', e => {
  if (e.key === 'Backspace' && e.target.tagName !== 'INPUT') {
    if (state.sub) goCat(); else if (state.cat) goHome();
  }
});

render();
</script>
